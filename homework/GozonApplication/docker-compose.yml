services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: ["2181:2181"]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092", "29092:29092"]
    environment:
      # Fixed broker id conflict after abrupt restarts.
      # If you ever see "NodeExistsException: /brokers/ids/..." again,
      # run: `docker compose down -v` and then `docker compose up`.
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 6000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 6000
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    restart: unless-stopped

  orders-db:
    image: postgres:15
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 30

  payments-db:
    image: postgres:15
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 30

  orders-service:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    depends_on:
      orders-db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://orders-db:5432/orders
      DB_USER: orders
      DB_PASS: orders
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["8081:8081"]

  payments-service:
    build:
      context: .
      dockerfile: payments-service/Dockerfile
    depends_on:
      payments-db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://payments-db:5432/payments
      DB_USER: payments
      DB_PASS: payments
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["8082:8082"]

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    depends_on: [orders-service, payments-service]
    ports: ["8080:8080"]
