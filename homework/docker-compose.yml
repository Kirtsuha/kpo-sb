services:
  postgres:
    image: postgres:16
    container_name: plagiarism-postgres
    environment:
      POSTGRES_DB: file_storage
      POSTGRES_USER: file_storage
      POSTGRES_PASSWORD: file_storage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: plagiarism-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  file-storage:
    build: ./file-storing-system
    container_name: file-storage
    depends_on:
      - postgres
      - minio
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/file_storage
      SPRING_DATASOURCE_USERNAME: file_storage
      SPRING_DATASOURCE_PASSWORD: file_storage
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: antiplagiarism-works
    ports:
      - "8081:8081"

  file-analysis:
    build: ./file-analysis-system
    container_name: file-analysis
    depends_on:
      - postgres
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/file_storage
      SPRING_DATASOURCE_USERNAME: file_storage
      SPRING_DATASOURCE_PASSWORD: file_storage
    ports:
      - "8082:8082"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      - file-storage
      - file-analysis
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SERVICES_STORAGE_BASE_URL: http://file-storage:8081
      SERVICES_ANALYSIS_BASE_URL: http://file-analysis:8082
    ports:
      - "8080:8080"

volumes:
  pgdata:
  miniodata:
